[package]
name = "buddies"
version = "0.1.4"
edition = "2024"
description = "P2P communication layer for AI agents"
license = "MIT"

[dependencies]
# MCP protocol
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }

# P2P networking
iroh = "1"
iroh-gossip = "0.101"
n0-future = "0.3"
notify = "8"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

# Schema generation — must match rmcp's schemars v1
schemars = "1"

# Local storage
redb = "4"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
data-encoding = "2"
rand = "0.10"
dirs = "6"
whoami = "2"
axum = "0.8"
