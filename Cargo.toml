[package]
name = "buddies"
version = "0.1.8"
edition = "2024"
rust-version = "1.91"
description = "P2P communication layer for AI agents"
license = "MIT"
repository = "https://github.com/iltumio/buddies"

[dependencies]
# MCP protocol
rmcp = { version = "3.4.1", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }

# P2P networking
iroh = "1"
iroh-gossip = "0.101"
n0-future = "0.3"
notify = "8"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Schema generation — must match rmcp's schemars v1
schemars = "1"

# Local storage
redb = "4"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
data-encoding = "2"
rand = "0.10"
dirs = "7"
whoami = "2"
axum = "0.8"
tempfile = "3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive", "env"] }
