name: CI

on:
  pull_request:
  # Main pushes run these same checks through release-plz before publishing.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Install tmux for worker group smoke test
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: MCP transport and shutdown smoke test
        run: |
          cargo build --locked
          python3 scripts/smoke_mcp.py
          python3 scripts/smoke_local_agents.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_room_tickets.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_worker.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_collaboration.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_linear_worker.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_worker_config.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_orchestrator.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_worker_specialists.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_multi_orchestrator_specialists.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_specialist_controls.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: cargo check --locked --all-targets
